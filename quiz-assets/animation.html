  // --- Geometry (from Iris Logomark SVG) ---
  const CX = 383.23;

    {ix:228.94,iy:408.24,ox:39.75,oy:447.07,angle:2.9809},
    {ix:227.56,iy:397.02,ox:18.17,oy:418.34,angle:3.0532},
    {ix:227.1,iy:385.77,ox:34.65,oy:385.75,angle:3.1253}
  ];

  // --- State ---
  let size = 0;
  let scale = 1;
  let mouse = { x: 0, y: 0, active: false };
  let smoothMouse = { x: 0, y: 0 };
  let startTime = null;

  // --- Settings ---
  const rotationSpeed = 10;
  const waveCount = 4;
  const waveAmplitude = 0.35;
  const mouseInfluence = 0.4;
  const mouseRadius = 250;

  // --- Resize: match container, keep square ---
  function resize() {
    const rect = container.getBoundingClientRect();
    size = Math.min(rect.width, rect.height);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = size / SVG_SIZE;
  }

  const ro = new ResizeObserver(resize);
  ro.observe(container);
  resize();

  // --- Coords ---
  function toScreen(x, y) { return [x * scale, y * scale]; }
  function fromScreen(sx, sy) { return [sx / scale, sy / scale]; }

  function getCanvasPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return [clientX - rect.left, clientY - rect.top];
  }

  // --- Input ---
  document.addEventListener('mousemove', (e) => {
    const [cx, cy] = getCanvasPos(e.clientX, e.clientY);
    mouse.x = cx; mouse.y = cy; mouse.active = true;
  });
  document.addEventListener('mouseleave', () => { mouse.active = false; });
  document.addEventListener('mouseenter', () => { mouse.active = true; });
  document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const [cx, cy] = getCanvasPos(t.clientX, t.clientY);
    mouse.x = cx; mouse.y = cy; mouse.active = true;
  }, { passive: false });
  document.addEventListener('touchend', () => { mouse.active = false; });

  // --- Gradient ---
  function goldGradient(x1, y1, x2, y2) {
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, '#ffdb9d');
    grad.addColorStop(1, '#a87d34');
    return grad;
  }

  // --- Animate ---
  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const time = (timestamp - startTime) / 1000;

    smoothMouse.x += (mouse.x - smoothMouse.x) * 0.08;
    smoothMouse.y += (mouse.y - smoothMouse.y) * 0.08;

    const [mSvgX, mSvgY] = fromScreen(smoothMouse.x, smoothMouse.y);
    const mdx = mSvgX - CX;
    const mdy = mSvgY - CY;
    const mouseAngle = Math.atan2(mdy, mdx);
    const mouseDist = Math.sqrt(mdx * mdx + mdy * mdy);

    ctx.clearRect(0, 0, size, size);

    const rotatingPhase = (time * Math.PI * 2 / rotationSpeed);

    lineData.forEach((line) => {
      const dx = line.ox - line.ix;
      const dy = line.oy - line.iy;

      const waveValue = Math.sin(line.angle * waveCount - rotatingPhase);
      let scaleFactor = 1 - (waveAmplitude * (1 - waveValue) / 2);

      if (mouse.active) {
        let angleDiff = line.angle - mouseAngle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

        const angularProximity = Math.exp(-angleDiff * angleDiff * 3);
        const distanceFactor = Math.max(0, 1 - mouseDist / (mouseRadius * 2));
        const mouseEffect = angularProximity * mouseInfluence * (0.5 + distanceFactor * 0.5);

        scaleFactor = scaleFactor + mouseEffect * (1 - scaleFactor) * 1.5;
        scaleFactor = Math.min(scaleFactor, 1.15);
      }

      const newOx = line.ix + dx * scaleFactor;
      const newOy = line.iy + dy * scaleFactor;

      const [sx1, sy1] = toScreen(line.ix, line.iy);
      const [sx2, sy2] = toScreen(newOx, newOy);

      ctx.beginPath();
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
      ctx.strokeStyle = goldGradient(sx1, sy1, sx2, sy2);
      ctx.lineWidth = Math.max(2.5 * scale, 0.75);
      ctx.lineCap = 'round';
      ctx.stroke();
    });

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
