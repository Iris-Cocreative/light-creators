<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" /><!-- data-seo-noindex -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founder Resonance — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
<style>
/* ── Standalone page base ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--lc-midnight);
    font-family: var(--lc-sans);
    color: var(--lc-sand);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

/* ── Results layout ── */
.results-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 80px 32px 120px;
}

/* ── Hero ── */
.results-hero {
    margin-bottom: 80px;
}
.results-hero-eyebrow {
    font-family: var(--lc-sans);
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--lc-soft-gold);
    opacity: 0.7;
    margin-bottom: 20px;
}
.results-hero-name {
    font-family: var(--lc-serif);
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 400;
    line-height: 1.15;
    color: var(--lc-sand);
    margin-bottom: 14px;
}
.results-hero-tagline {
    font-family: var(--lc-sans);
    font-size: 1.05rem;
    font-weight: 350;
    color: var(--lc-sand-60);
    line-height: 1.6;
}

/* ── Radar section ── */
.results-radar-section {
    position: relative;
    margin-bottom: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.results-radar-wrap {
    position: relative;
    width: min(600px, 90vw);
    height: min(600px, 90vw);
}
.results-iris-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}
.results-iris-bg canvas {
    display: block;
    width: 100%;
    height: 100%;
}
.results-radar-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
}
.results-radar-canvas canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* ── Factors card ── */
.results-factors-card {
    border: 1px solid var(--lc-sand-06);
    border-radius: 12px;
    padding: 36px 40px;
    margin-bottom: 60px;
}
.lc-factor-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--lc-sand-04);
}
.lc-factor-item:last-child { border-bottom: none; }

.lc-factor-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    opacity: 0.5;
}
.lc-factor-icon svg {
    width: 100%;
    height: 100%;
}
.lc-factor-name {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--lc-sand-60);
    width: 130px;
    flex-shrink: 0;
}
.lc-factor-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--lc-sand-04);
    border-radius: 3px;
    overflow: hidden;
}
.lc-factor-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 1.2s cubic-bezier(0.22,1,0.36,1);
    width: 0;
}
.lc-factor-bar.high { background: linear-gradient(90deg, var(--lc-aurora), var(--lc-soft-gold)); }
.lc-factor-bar.mid { background: linear-gradient(90deg, var(--lc-horizon), var(--lc-aurora)); }
.lc-factor-bar.low { background: linear-gradient(90deg, var(--lc-gold-30), var(--lc-soft-gold)); }

.lc-factor-score {
    font-family: var(--lc-serif);
    font-size: 0.95rem;
    color: var(--lc-sand);
    width: 50px;
    text-align: right;
    flex-shrink: 0;
}

/* ── Profile section ── */
.results-profile { margin-bottom: 60px; }
.results-profile .eyebrow {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--lc-aurora);
    opacity: 0.5;
    margin-bottom: 20px;
}
.results-profile p {
    font-size: 0.98rem;
    font-weight: 350;
    color: var(--lc-sand-70);
    line-height: 1.85;
    margin-bottom: 20px;
}

/* ── Lever ── */
.results-lever { margin-bottom: 60px; }
.results-lever .eyebrow {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--lc-aurora);
    opacity: 0.5;
    margin-bottom: 16px;
}
.results-lever h3 {
    font-family: var(--lc-serif);
    font-size: 1.4rem;
    font-weight: 400;
    color: var(--lc-sand);
    margin-bottom: 8px;
}
.results-lever .lever-score {
    font-size: 0.85rem;
    color: var(--lc-soft-gold);
    margin-bottom: 12px;
}
.results-lever .lever-next {
    font-size: 0.95rem;
    color: var(--lc-sand-60);
    line-height: 1.7;
    font-style: italic;
    font-family: var(--lc-serif);
}

@media (max-width: 640px) {
    .results-page { padding: 48px 20px 80px; }
    .results-factors-card { padding: 24px 20px; }
    .lc-factor-name { width: 100px; font-size: 0.65rem; }
    .lc-factor-icon { width: 28px; height: 28px; }
}
</style>
</head>
<body>

<div class="results-page">

    <!-- ── Hero ── -->
    <section class="results-hero">
        <p class="results-hero-eyebrow">For Founders at the Threshold</p>
        <h1 class="results-hero-name" id="typeName">The Almost-There Founder</h1>
        <p class="results-hero-tagline" id="typeTagline">Everything is there. Now it needs coherence.</p>
    </section>

    <!-- ── Radar + Iris Animation ── -->
    <section class="results-radar-section">
        <div class="results-radar-wrap" id="radarWrap">
            <div class="results-iris-bg" id="irisBg"><canvas></canvas></div>
            <div class="results-radar-canvas" id="radarCanvas"><canvas></canvas></div>
        </div>
    </section>

    <!-- ── Factor Scores ── -->
    <section class="results-factors-card" id="factorsCard">
        <!-- Injected by script -->
    </section>

    <!-- ── Profile ── -->
    <section class="results-profile">
        <p class="eyebrow">Your Profile</p>
        <div id="profileText"></div>
    </section>

    <!-- ── Development Lever ── -->
    <section class="results-lever">
        <p class="eyebrow">Your Development Lever</p>
        <h3 id="leverName"></h3>
        <p class="lever-score" id="leverScore"></p>
        <p class="lever-next" id="leverNext"></p>
    </section>

</div>

    // ══════════════════════════════════════════════

    var radarContainer = document.getElementById('radarCanvas');

    function drawRadar() {
        var rect = radarContainer.getBoundingClientRect();
        var size = Math.min(rect.width, rect.height);
        var dpr = window.devicePixelRatio || 1;
        radarCvs.width = size * dpr;
        radarCvs.height = size * dpr;
        radarCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var cx = size / 2, cy = size / 2;
        var r = size * 0.3;

        radarCtx.clearRect(0, 0, size, size);

        // Grid rings
        for (var ring = 2; ring <= 10; ring += 2) {
            radarCtx.beginPath();
            for (var i = 0; i <= 5; i++) {
                var angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
                var x = cx + (r * ring / 10) * Math.cos(angle);
                var y = cy + (r * ring / 10) * Math.sin(angle);
                if (i === 0) radarCtx.moveTo(x, y); else radarCtx.lineTo(x, y);
            }
            radarCtx.closePath();
            radarCtx.strokeStyle = 'rgba(255,248,230,0.06)';
            radarCtx.lineWidth = 0.5;
            radarCtx.stroke();
        }

        // Axes
        for (var j = 0; j < 5; j++) {
            var axAngle = (Math.PI * 2 * j / 5) - Math.PI / 2;
            radarCtx.beginPath();
            radarCtx.moveTo(cx, cy);
            radarCtx.lineTo(cx + r * Math.cos(axAngle), cy + r * Math.sin(axAngle));
            radarCtx.strokeStyle = 'rgba(255,248,230,0.06)';
            radarCtx.lineWidth = 0.5;
            radarCtx.stroke();
        }

        // Data shape — filled
        radarCtx.beginPath();
        FACTORS.forEach(function(f, i) {
            var val = SCORES[f] / 10;
            var angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
            var x = cx + r * val * Math.cos(angle);
            var y = cy + r * val * Math.sin(angle);
            if (i === 0) radarCtx.moveTo(x, y); else radarCtx.lineTo(x, y);
        });
        radarCtx.closePath();
        var fillGrad = radarCtx.createRadialGradient(cx, cy, 0, cx, cy, r);
        fillGrad.addColorStop(0, 'rgba(5,64,76,0.5)');
        fillGrad.addColorStop(1, 'rgba(5,64,76,0.15)');
        radarCtx.fillStyle = fillGrad;
        radarCtx.fill();

        // Data shape — stroke
        radarCtx.beginPath();
        FACTORS.forEach(function(f, i) {
            var val = SCORES[f] / 10;
            var angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
            var x = cx + r * val * Math.cos(angle);
            var y = cy + r * val * Math.sin(angle);
            if (i === 0) radarCtx.moveTo(x, y); else radarCtx.lineTo(x, y);
        });
        radarCtx.closePath();
        radarCtx.strokeStyle = '#E0B76F';
        radarCtx.lineWidth = 1.5;
        radarCtx.stroke();

        // Points + Labels
        FACTORS.forEach(function(f, i) {
            var val = SCORES[f] / 10;
            var angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
            var x = cx + r * val * Math.cos(angle);
            var y = cy + r * val * Math.sin(angle);

            // Point
            radarCtx.beginPath();
            radarCtx.arc(x, y, 4, 0, Math.PI * 2);
            radarCtx.fillStyle = '#E0B76F';
            radarCtx.fill();

            // Label
            var lx = cx + (r + size * 0.08) * Math.cos(angle);
            var ly = cy + (r + size * 0.08) * Math.sin(angle);
            radarCtx.font = '600 ' + Math.max(9, size * 0.018) + 'px Hanken Grotesk';
            radarCtx.fillStyle = 'rgba(255,248,230,0.45)';
            radarCtx.textAlign = 'center';
            radarCtx.textBaseline = 'middle';
            radarCtx.letterSpacing = '0.12em';
            radarCtx.fillText(FACTOR_LABELS[f].toUpperCase(), lx, ly - size * 0.015);

            // Score below label
            radarCtx.font = '600 ' + Math.max(11, size * 0.022) + 'px Hanken Grotesk';
            radarCtx.fillStyle = '#E0B76F';
            radarCtx.fillText(SCORES[f].toFixed(1), lx, ly + size * 0.02);
        });
    }

    // The 5 factor angles on the radar chart (top=obsession, clockwise)
    // Radar uses: angle = (2PI * i / 5) - PI/2
    var factorAngles = FACTORS.map(function(f, i) {
        return (Math.PI * 2 * i / 5) - Math.PI / 2;
    });

    // For each iris ray, compute a score-influence factor based on
    // proximity to each of the 5 factor axes
    function getScoreInfluence(rayAngle) {
        var totalWeight = 0;
        var weightedScore = 0;
        for (var i = 0; i < 5; i++) {
            var diff = rayAngle - factorAngles[i];
            // Normalize to [-PI, PI]
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            // Gaussian weight — rays closest to a factor axis get most influence
            var w = Math.exp(-diff * diff * 2.5);
            totalWeight += w;
            weightedScore += w * (SCORES[FACTORS[i]] / 10);
        }
        return totalWeight > 0 ? weightedScore / totalWeight : 0.5;
    }

    // ── Iris animation with score modulation ──
    var irisContainer = document.getElementById('irisBg');
    var irisCvs = irisContainer.querySelector('canvas');
    var irisCtx = irisCvs.getContext('2d');
    var irisSize = 0, irisScale = 1;
    var startTime = null;

    function resizeIris() {
        var rect = irisContainer.getBoundingClientRect();
        irisSize = Math.min(rect.width, rect.height);
        var dpr = window.devicePixelRatio || 1;
        irisCvs.width = irisSize * dpr;
        irisCvs.height = irisSize * dpr;
        irisCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        irisScale = irisSize / SVG_SIZE;
    }

    var ro = new ResizeObserver(resizeIris);
    ro.observe(irisContainer);
    resizeIris();

    function irisToScreen(x, y) { return [x * irisScale, y * irisScale]; }

    function animateIris(timestamp) {
        if (!startTime) startTime = timestamp;
        var time = (timestamp - startTime) / 1000;

        irisCtx.clearRect(0, 0, irisSize, irisSize);

        var rotPhase = time * Math.PI * 2 / 14; // Slower rotation for results

        lineData.forEach(function(line) {
            var dx = line.ox - line.ix;
            var dy = line.oy - line.iy;

            // Score influence: rays near high-scoring factors extend more
            var scoreInf = getScoreInfluence(line.angle);

            // Gentle wave
            var waveVal = Math.sin(line.angle * 4 - rotPhase);
            var waveModulation = 0.12 * (1 - waveVal) / 2;

            // Base scale: 0.3 (min) to 1.0 (max), driven by score
            var baseSf = 0.25 + scoreInf * 0.75;
            var sf = baseSf - waveModulation;
            sf = Math.max(0.15, Math.min(sf, 1.1));

            var nx = line.ix + dx * sf;
            var ny = line.iy + dy * sf;

            var s1 = irisToScreen(line.ix, line.iy);
            var s2 = irisToScreen(nx, ny);

            var grad = irisCtx.createLinearGradient(s1[0], s1[1], s2[0], s2[1]);
            grad.addColorStop(0, 'rgba(255,219,157,' + (0.5 + scoreInf * 0.5) + ')');
            grad.addColorStop(1, 'rgba(168,125,52,' + (0.3 + scoreInf * 0.4) + ')');

            irisCtx.beginPath();
            irisCtx.moveTo(s1[0], s1[1]);
            irisCtx.lineTo(s2[0], s2[1]);
            irisCtx.strokeStyle = grad;
            irisCtx.lineWidth = Math.max(2 * irisScale, 0.5);
            irisCtx.lineCap = 'round';
            irisCtx.stroke();
        });

        requestAnimationFrame(animateIris);
    }

    requestAnimationFrame(animateIris);
