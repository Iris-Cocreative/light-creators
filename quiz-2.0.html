<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" /><!-- data-seo-noindex -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Founder Resonance Assessment — Light Creators</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <style>
        :root {
            --midnight-blue: #04171F;
            --grounding-umber: #393231;
            --gold-bright: #FFDB9D;
            --gold-dark: #A87D34;
            --soft-gold: #E0B76F;
            --aurora-tide: #83A18E;
            --open-horizon: #05404C;
            --luminous-sand: #FFF8E6;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Hanken Grotesk', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--midnight-blue);
            color: var(--luminous-sand);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Rotating Background ── */
        .bg-rotate {
            position: fixed;
            top: 50%; left: 50%;
            width: 160vmax; height: 160vmax;
            transform: translate(-50%, -50%) rotate(0deg);
            animation: bgSpin 180s linear infinite;
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
        }

        .bg-rotate img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        @keyframes bgSpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ── Radial Overlay (welcome only) ── */
        .radial-overlay {
            position: absolute;
            top: 50%; left: 50%;
            width: min(90vw, 700px); height: min(90vw, 700px);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.12;
        }

        .radial-overlay img { width: 100%; height: 100%; object-fit: contain; }

        /* ── Logo ── */
        .logo-header {
            position: fixed;
            top: 22px; left: 24px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .logo-header.visible { opacity: 0.85; }
        .logo-header img { height: 89px; width: auto; }

        /* ── Lang Toggle ── */
        .lang-toggle {
            position: fixed; top: 20px; right: 24px; z-index: 100;
            display: flex; background: rgba(255,248,230,0.06);
            border: 1px solid rgba(255,248,230,0.08);
            border-radius: 100px; padding: 3px;
            backdrop-filter: blur(8px);
        }

        .lang-btn {
            padding: 5px 13px; font-family: var(--font-sans);
            font-size: 0.65rem; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(255,248,230,0.35); cursor: pointer;
            border: none; background: transparent;
            border-radius: 100px; transition: all 0.25s;
        }

        .lang-btn.active {
            background: rgba(255,248,230,0.1);
            color: var(--luminous-sand);
        }

        /* ── Progress ── */
        .progress-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 90; }
        .progress-track { height: 2px; background: rgba(255,248,230,0.04); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--open-horizon), var(--soft-gold)); transition: width 0.6s cubic-bezier(0.22,1,0.36,1); width: 0%; }
        .progress-text { text-align: center; padding: 10px 0 0; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--aurora-tide); opacity: 0.35; }

        /* ── Screens ── */
        .screen { display: none; min-height: 100vh; padding: 80px 24px 60px; position: relative; z-index: 2; }
        .screen.active { display: flex; justify-content: center; align-items: center; animation: screenIn 0.55s ease forwards; }
        @keyframes screenIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .screen-inner { max-width: 620px; width: 100%; }

        /* ── Welcome ── */
        .welcome-screen { text-align: center; position: relative; }
        .welcome-logo { margin-bottom: 48px; }
        .welcome-logo img { height: 40px; width: auto; opacity: 0.9; }
        .welcome-eyebrow { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--aurora-tide); opacity: 0.5; margin-bottom: 24px; }
        .welcome-title { font-family: var(--font-serif); font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 400; line-height: 1.2; color: var(--luminous-sand); margin-bottom: 24px; }
        .welcome-title em { font-style: italic; color: var(--soft-gold); }
        .welcome-sub { font-size: 1rem; font-weight: 350; color: rgba(255,248,230,0.6); line-height: 1.75; margin-bottom: 12px; max-width: 480px; margin-left: auto; margin-right: auto; }
        .welcome-note { font-family: var(--font-serif); font-size: 0.95rem; font-style: italic; color: var(--aurora-tide); opacity: 0.5; margin-bottom: 48px; }

        .btn-gold {
            display: inline-block; font-family: var(--font-sans);
            font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em;
            color: var(--midnight-blue); background: linear-gradient(135deg, var(--gold-bright), var(--soft-gold));
            padding: 16px 52px; border: none; border-radius: 6px;
            cursor: pointer; transition: all 0.35s ease;
            box-shadow: 0 4px 24px rgba(224,183,111,0.12);
        }

        .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(224,183,111,0.22); background: linear-gradient(135deg, var(--luminous-sand), var(--gold-bright)); }

        /* ── Questions ── */
        .q-section { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft-gold); opacity: 0.45; margin-bottom: 6px; }
        .q-factor { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aurora-tide); margin-bottom: 28px; opacity: 0.6; }
        .q-text { font-family: var(--font-serif); font-size: clamp(1.3rem, 3.5vw, 1.9rem); font-weight: 400; line-height: 1.4; color: var(--luminous-sand); margin-bottom: 40px; }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option {
            display: flex; align-items: flex-start; gap: 16px;
            padding: 17px 22px; background: rgba(255,248,230,0.025);
            border: 1px solid rgba(255,248,230,0.06); border-radius: 8px;
            cursor: pointer; transition: all 0.25s ease; position: relative;
        }

        .option:hover { background: rgba(255,248,230,0.05); border-color: rgba(224,183,111,0.15); }
        .option.selected { background: rgba(5,64,76,0.25); border-color: var(--open-horizon); }

        .option-marker {
            width: 20px; height: 20px; border-radius: 50%;
            border: 1.5px solid rgba(255,248,230,0.15); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s; margin-top: 1px;
        }

        .option.selected .option-marker { border-color: var(--aurora-tide); background: var(--aurora-tide); }
        .option.selected .option-marker::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--midnight-blue); }
        .option-text { font-size: 0.9rem; line-height: 1.55; color: rgba(255,248,230,0.7); font-weight: 350; }
        .option.selected .option-text { color: var(--luminous-sand); }

        .q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; }
        .btn-back { font-family: var(--font-sans); font-size: 0.75rem; color: var(--aurora-tide); opacity: 0.4; background: none; border: none; cursor: pointer; transition: opacity 0.2s; padding: 8px 0; letter-spacing: 0.03em; }
        .btn-back:hover { opacity: 0.75; }
        .btn-next { font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600; color: var(--midnight-blue); background: linear-gradient(135deg, var(--gold-bright), var(--soft-gold)); padding: 12px 32px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; opacity: 0.2; pointer-events: none; letter-spacing: 0.06em; }
        .btn-next.enabled { opacity: 1; pointer-events: auto; }
        .btn-next.enabled:hover { transform: translateY(-1px); }

        /* ── Transitions ── */
        .transition-screen { text-align: center; }
        .transition-text { font-family: var(--font-serif); font-size: 1.15rem; font-style: italic; color: rgba(255,248,230,0.55); line-height: 1.85; max-width: 440px; margin: 0 auto 40px; }

        /* ── Email Capture ── */
        .email-screen { text-align: center; }
        .email-title { font-family: var(--font-serif); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 400; color: var(--luminous-sand); margin-bottom: 14px; }
        .email-sub { font-size: 0.92rem; color: rgba(255,248,230,0.5); margin-bottom: 40px; font-weight: 350; }
        .email-form { display: flex; flex-direction: column; gap: 14px; max-width: 380px; margin: 0 auto; }
        .email-input { font-family: var(--font-sans); font-size: 0.88rem; padding: 14px 18px; background: rgba(255,248,230,0.04); border: 1px solid rgba(255,248,230,0.1); border-radius: 6px; color: var(--luminous-sand); outline: none; transition: border-color 0.25s; font-weight: 400; }
        .email-input::placeholder { color: rgba(255,248,230,0.25); }
        .email-input:focus { border-color: rgba(224,183,111,0.3); }

        /* ── Loading ── */
        .loading-screen { text-align: center; }
        .loading-text { font-family: var(--font-serif); font-size: 1.3rem; color: var(--luminous-sand); margin-bottom: 24px; }
        .loading-dots { display: flex; justify-content: center; gap: 8px; }
        .loading-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soft-gold); animation: ldot 1.4s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes ldot { 0%,80%,100% { opacity: 0.15; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

        /* ══════════════════════════════
           RESULTS PAGE
           ══════════════════════════════ */
        .results-page { padding: 60px 24px 80px; min-height: 100vh; position: relative; z-index: 2; display: none; }
        .results-page.active { display: block; animation: screenIn 0.6s ease forwards; }
        .results-container { max-width: 720px; margin: 0 auto; }

        /* Results Hero */
        .r-hero { text-align: center; padding: 40px 0 48px; position: relative; }
        .r-hero__type-icon { width: 56px; height: 56px; margin: 0 auto 20px; opacity: 0.6; }
        .r-hero__type-icon img { width: 100%; height: 100%; }
        .r-hero__label { font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--soft-gold); opacity: 0.6; margin-bottom: 12px; }
        .r-hero__type { font-family: var(--font-serif); font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 400; color: var(--luminous-sand); margin-bottom: 12px; }
        .r-hero__tagline { font-family: var(--font-serif); font-size: 1.05rem; font-style: italic; color: var(--soft-gold); opacity: 0.7; margin-bottom: 40px; }

        /* Radar Chart */
        .r-radar { display: flex; justify-content: center; margin-bottom: 48px; }
        .r-radar canvas { max-width: 300px; max-height: 300px; }

        /* Factor Scores Bar */
        .r-factors { margin-bottom: 56px; }
        .r-factor-item { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(255,248,230,0.04); }
        .r-factor-item:last-child { border-bottom: none; }
        .r-factor-name { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,248,230,0.5); width: 120px; flex-shrink: 0; }
        .r-factor-bar-wrap { flex: 1; height: 6px; background: rgba(255,248,230,0.04); border-radius: 3px; position: relative; overflow: hidden; }
        .r-factor-bar { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(0.22,1,0.36,1); width: 0; }
        .r-factor-bar.high { background: linear-gradient(90deg, var(--aurora-tide), var(--soft-gold)); }
        .r-factor-bar.mid { background: linear-gradient(90deg, var(--open-horizon), var(--aurora-tide)); }
        .r-factor-bar.low { background: linear-gradient(90deg, rgba(224,183,111,0.3), var(--soft-gold)); }
        .r-factor-score { font-family: var(--font-serif); font-size: 0.95rem; color: var(--luminous-sand); width: 44px; text-align: right; flex-shrink: 0; }
        .r-factor-warn { color: var(--soft-gold); font-size: 0.7rem; margin-left: 4px; }

        /* Divider */
        .r-divider { width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--soft-gold), transparent); margin: 0 auto 48px; }

        /* Profile Section */
        .r-profile { margin-bottom: 56px; }
        .r-profile__eyebrow { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--soft-gold); opacity: 0.5; margin-bottom: 16px; }
        .r-profile__text { font-family: var(--font-sans); font-size: 0.98rem; font-weight: 350; color: rgba(255,248,230,0.7); line-height: 1.85; margin-bottom: 20px; }

        /* Development Lever */
        .r-lever { background: rgba(5,64,76,0.15); border: 1px solid rgba(5,64,76,0.2); border-radius: 12px; padding: 28px 32px; margin-bottom: 56px; }
        .r-lever__eyebrow { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--aurora-tide); margin-bottom: 12px; }
        .r-lever__title { font-family: var(--font-serif); font-size: 1.2rem; color: var(--luminous-sand); margin-bottom: 8px; }
        .r-lever__score { font-size: 0.82rem; color: var(--soft-gold); margin-bottom: 16px; }
        .r-lever__next { font-size: 0.9rem; font-weight: 350; color: rgba(255,248,230,0.6); line-height: 1.7; font-style: italic; }

        /* Path Choice Section */
        .r-paths { margin-bottom: 56px; }
        .r-paths__title { font-family: var(--font-serif); font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 400; color: var(--luminous-sand); text-align: center; margin-bottom: 32px; }

        .r-path-card {
            background: rgba(255,248,230,0.025);
            border: 1px solid rgba(255,248,230,0.06);
            border-radius: 12px; padding: 32px;
            margin-bottom: 16px; transition: border-color 0.3s;
        }

        .r-path-card:hover { border-color: rgba(224,183,111,0.15); }
        .r-path-card.recommended { border-color: rgba(224,183,111,0.2); background: rgba(224,183,111,0.03); }

        .r-path-badge { display: inline-block; font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--soft-gold); background: rgba(224,183,111,0.08); padding: 4px 12px; border-radius: 100px; margin-bottom: 16px; font-weight: 600; }

        .r-path-title { font-family: var(--font-serif); font-size: 1.15rem; color: var(--luminous-sand); margin-bottom: 6px; }
        .r-path-sub { font-size: 0.82rem; color: rgba(255,248,230,0.45); margin-bottom: 20px; font-style: italic; }

        .r-path-list { list-style: none; margin-bottom: 20px; }
        .r-path-list li { font-size: 0.85rem; font-weight: 350; color: rgba(255,248,230,0.6); padding: 6px 0 6px 20px; position: relative; line-height: 1.6; }
        .r-path-list li::before { content: '→'; position: absolute; left: 0; color: var(--soft-gold); opacity: 0.4; font-size: 0.8rem; }

        .r-path-outcome { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--aurora-tide); margin-bottom: 10px; margin-top: 16px; }
        .r-path-outcome-list { list-style: none; }
        .r-path-outcome-list li { font-size: 0.82rem; font-weight: 350; color: rgba(255,248,230,0.55); padding: 4px 0 4px 16px; position: relative; }
        .r-path-outcome-list li::before { content: '✓'; position: absolute; left: 0; color: var(--aurora-tide); font-size: 0.72rem; }

        .r-path-btn {
            display: block; width: 100%; text-align: center;
            font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600;
            letter-spacing: 0.08em; padding: 14px 24px;
            border-radius: 6px; border: none; cursor: pointer;
            transition: all 0.3s; margin-top: 20px; text-decoration: none;
        }

        .r-path-btn.primary {
            color: var(--midnight-blue);
            background: linear-gradient(135deg, var(--gold-bright), var(--soft-gold));
            box-shadow: 0 4px 20px rgba(224,183,111,0.12);
        }

        .r-path-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(224,183,111,0.2); }

        .r-path-btn.secondary {
            color: var(--luminous-sand);
            background: rgba(255,248,230,0.06);
            border: 1px solid rgba(255,248,230,0.1);
        }

        .r-path-btn.secondary:hover { background: rgba(255,248,230,0.1); }

        /* Express Path Details */
        .r-express-steps { list-style: none; margin-bottom: 16px; counter-reset: step; }
        .r-express-steps li { font-size: 0.82rem; font-weight: 350; color: rgba(255,248,230,0.55); padding: 6px 0 6px 28px; position: relative; counter-increment: step; line-height: 1.55; }
        .r-express-steps li::before { content: counter(step); position: absolute; left: 0; width: 18px; height: 18px; border-radius: 50%; background: rgba(5,64,76,0.3); color: var(--aurora-tide); font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; top: 7px; }

        .r-express-fit { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft-gold); opacity: 0.5; margin-bottom: 8px; margin-top: 16px; }
        .r-express-fit-list { list-style: none; }
        .r-express-fit-list li { font-size: 0.8rem; font-weight: 350; color: rgba(255,248,230,0.5); padding: 3px 0 3px 16px; position: relative; }
        .r-express-fit-list li::before { content: '·'; position: absolute; left: 4px; color: var(--soft-gold); }

        /* Final CTA Micro */
        .r-micro { text-align: center; font-family: var(--font-serif); font-size: 0.88rem; font-style: italic; color: rgba(255,248,230,0.3); max-width: 480px; margin: 32px auto 0; line-height: 1.7; }

        /* Footer */
        .r-footer { text-align: center; padding-top: 48px; border-top: 1px solid rgba(255,248,230,0.04); margin-top: 56px; }
        .r-footer__text { font-size: 0.65rem; letter-spacing: 0.06em; color: rgba(255,248,230,0.15); }

        @media (max-width: 640px) {
            .screen { padding: 60px 20px 40px; }
            .option { padding: 14px 16px; }
            .r-path-card { padding: 24px 20px; }
            .r-factor-name { width: 90px; font-size: 0.65rem; }
            .r-lever { padding: 24px 20px; }
        }
    </style>
</head>
<body>

<div class="bg-rotate"><img src="https://lab.iriscocreative.com/light-creators/Background-gradient%20large.jpg" alt=""></div>

<div class="logo-header" id="logoHeader"><a href="#"><img src="https://lab.iriscocreative.com/client-mockups/Logo%20Export.png" alt="Light Creators"></a></div>

<div class="lang-toggle">
    <button class="lang-btn" onclick="setLang('de')">DE</button>
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
</div>

<div class="progress-bar" id="progressBar" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
</div>

<div id="app"></div>

<script>

};

let answers = {};
let currentScreen = 'welcome';

function L(obj) { return obj[LANG.current] || obj.en; }

function setLang(lang) {
    LANG.current = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[onclick="setLang('${lang}')"]`).classList.add('active');
    renderCurrentScreen();
}

function getScores() {
    let s = {obsession:[],presence:[],vision:[],fit:[],logic:[]};
    Object.values(answers).forEach(a => { if(a&&a.scores) Object.entries(a.scores).forEach(([k,v])=>{ if(s[k]) s[k].push(v); }); });
    let avg = {};
    Object.entries(s).forEach(([k,v])=>{ avg[k] = v.length ? Math.round((v.reduce((a,b)=>a+b,0)/v.length)*10)/10 : 5; });
    return avg;
}

function determineType(scores) {
    const {obsession,presence,vision,fit,logic} = scores;
    if(logic>=7 && presence<=5 && vision>=6) return 'logical-visionary';
    if(presence>=7 && fit>=6 && vision<=5) return 'quiet-powerhouse';
    if(presence>=6 && obsession>=7 && logic<=5) return 'story-driven';
    if(obsession>=6 && presence>=6 && vision>=6 && fit>=6 && logic>=6) return 'integrated-builder';
    if(obsession>=8 && presence<=3) return 'overloaded-operator';
    if(vision>=8 && obsession>=8 && presence<=4 && logic<=4) return 'disconnected-genius';
    return 'almost-there';
}

                        <button class="r-path-btn primary">${L({en:'Start Email Course (free, 7 days)',de:'E-Mail-Kurs starten (kostenlos, 7 Tage)'})}</button>
                    </div>

                    <div class="r-path-card">
                        <div class="r-path-title">${L({en:'Direct to Diagnostic Call',de:'Direkt zum Diagnostik-Gespräch'})}</div>
                        <div class="r-path-sub">${L({en:'If you\'re already ready to close your resonance gap',de:'Wenn du bereits bereit bist, deine Resonanz-Lücke zu schließen'})}</div>

                        <ol class="r-express-steps">
                            <li>${L({en:'Fill out application (4 questions, 3 min)',de:'Bewerbung ausfüllen (4 Fragen, 3 Min.)'})}</li>

                        </ol>

                        <div class="r-express-fit">${L({en:'This is for you if',de:'Das ist für dich, wenn'})}</div>
                        <ul class="r-express-fit-list">

                            <li>${L({en:'You want direct 1:1 feedback',de:'Du direktes 1:1 Feedback willst'})}</li>
                            <li>${L({en:'You want to close your next round in 3–6 months',de:'Du deine nächste Runde in 3–6 Monaten schließen willst'})}</li>

                </div>

                <p class="r-micro">${L(type.micro)}</p>

        requestAnimationFrame(()=>{

                document.querySelectorAll('.r-factor-bar').forEach(bar=>{
                    bar.style.width = bar.dataset.width + '%';

        drawRadar(useScores);
    } else if(typeof currentScreen === 'number') {
        logo.classList.add('visible');

}

function renderQuestion(qNum) {
    const q = QUESTIONS[qNum-1];
    const pct = Math.round((qNum/15)*100);
    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('progressText').textContent = L({en:'Discovery',de:'Entdeckung'})+' ━━━ '+pct+'%';

    const selectedIdx = answers[qNum] ? answers[qNum].idx : -1;
    const app = document.getElementById('app');
    app.innerHTML = `<div class="screen active"><div class="screen-inner">
        <div class="q-section">${L(q.section)}</div>
        <div class="q-factor">${L(q.factor)}</div>
        <h2 class="q-text">${L(q.text)}</h2>
        <div class="options">
            ${q.options.map((opt,i)=>`
                <div class="option ${selectedIdx===i?'selected':''}" onclick="selectOption(${qNum},${i})">
                    <div class="option-marker"></div>
                    <div class="option-text">${L(opt)}</div>
                </div>`).join('')}
        </div>
        <div class="q-nav">
            <button class="btn-back" onclick="goBack(${qNum})">${qNum>1?'← '+L({en:'Back',de:'Zurück'}):''}</button>
            <button class="btn-next ${selectedIdx>=0?'enabled':''}" onclick="goNext(${qNum})">${L({en:'Continue',de:'Weiter'})}</button>
        </div>
    </div></div>`;
}

function selectOption(qNum, optIdx) {
    answers[qNum] = {idx:optIdx, scores:QUESTIONS[qNum-1].options[optIdx].scores};
    document.querySelectorAll('.option').forEach((el,i)=>el.classList.toggle('selected',i===optIdx));
    const btn = document.querySelector('.btn-next');
    if(btn) btn.classList.add('enabled');
}

function goNext(qNum) {
    if(!answers[qNum]) return;
    if(qNum===2) currentScreen='transition1';
    else if(qNum===12) currentScreen='transition2';
    else if(qNum===15) currentScreen='email';
    else currentScreen=qNum+1;
    renderCurrentScreen();
}

function goBack(qNum) {
    if(qNum===1) return;
    if(qNum===3){currentScreen='transition1';renderCurrentScreen();return;}
    if(qNum===13){currentScreen='transition2';renderCurrentScreen();return;}
    currentScreen=qNum-1;
    renderCurrentScreen();
}

function goToQuestion(num) { currentScreen=num; renderCurrentScreen(); }
function showResults() { currentScreen='loading'; renderCurrentScreen(); }

function drawRadar(scores) {
    const canvas = document.getElementById('radarCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const cx=150,cy=150,r=115;
    const factors=['obsession','presence','vision','fit','logic'];
    const labels = LANG.current==='de'
        ? ['Obsession','Präsenz','Vision','Founder Fit','Scalable Logic']
        : ['Obsession','Presence','Vision','Founder Fit','Scalable Logic'];

    ctx.clearRect(0,0,300,300);

    // Grid
    for(let ring=2;ring<=10;ring+=2){
        ctx.beginPath();
        for(let i=0;i<=5;i++){
            const angle=(Math.PI*2*i/5)-Math.PI/2;
            const x=cx+(r*ring/10)*Math.cos(angle);
            const y=cy+(r*ring/10)*Math.sin(angle);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.strokeStyle='rgba(255,248,230,0.05)';
        ctx.stroke();
    }

    // Axes
    for(let i=0;i<5;i++){
        const angle=(Math.PI*2*i/5)-Math.PI/2;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+r*Math.cos(angle),cy+r*Math.sin(angle));
        ctx.strokeStyle='rgba(255,248,230,0.06)'; ctx.stroke();
    }

    // Data
    ctx.beginPath();
    factors.forEach((f,i)=>{
        const val=scores[f]/10;
        const angle=(Math.PI*2*i/5)-Math.PI/2;
        const x=cx+r*val*Math.cos(angle);
        const y=cy+r*val*Math.sin(angle);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle='rgba(5,64,76,0.3)';
    ctx.fill();
    ctx.strokeStyle='#E0B76F';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // Points + Labels
    factors.forEach((f,i)=>{
        const val=scores[f]/10;
        const angle=(Math.PI*2*i/5)-Math.PI/2;
        const x=cx+r*val*Math.cos(angle);
        const y=cy+r*val*Math.sin(angle);
        ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
        ctx.fillStyle='#E0B76F'; ctx.fill();

        const lx=cx+(r+22)*Math.cos(angle);
        const ly=cy+(r+22)*Math.sin(angle);
        ctx.font='500 9px Hanken Grotesk';
        ctx.fillStyle='rgba(255,248,230,0.4)';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(labels[i],lx,ly);
        ctx.font='600 10px Hanken Grotesk';
        ctx.fillStyle='#E0B76F';
        ctx.fillText(scores[f].toFixed(1),lx,ly+13);
    });
}

renderCurrentScreen();
</script>
