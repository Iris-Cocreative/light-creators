<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radial Burst Assessment</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg-deep: #0a1a1f;
    --bg-mid: #0f2329;
    --line-gold: #c9a96e;
    --line-gold-dim: rgba(201, 169, 110, 0.35);
    --pentagon-stroke: rgba(180, 200, 210, 0.25);
    --spider-stroke: rgba(100, 200, 180, 0.6);
    --dot-gold: #d4b070;
    --text-light: rgba(200, 210, 215, 0.9);
    --text-dim: rgba(200, 210, 215, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text-light);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 900px;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-width: 700px;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .controls {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .slider-label {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    width: 130px;
    text-align: right;
    flex-shrink: 0;
  }

  .slider-track {
    flex: 1;
    position: relative;
    height: 28px;
    display: flex;
    align-items: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, var(--line-gold-dim), var(--line-gold));
    border-radius: 1px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--dot-gold);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 6px rgba(201, 169, 110, 0.4);
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--dot-gold);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 6px rgba(201, 169, 110, 0.4);
    cursor: pointer;
  }

  .slider-value {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    color: var(--line-gold);
    width: 36px;
    text-align: left;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .slider-label {
      width: 90px;
      font-size: 0.7rem;
    }
    .container { padding: 1rem 0.5rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="canvas-wrap">
    <canvas id="chart"></canvas>
  </div>
  <div class="controls" id="controls"></div>
</div>

      [234.01,464.9,217.82,478.3],

      [251.02,482.26,242.79,491.8],
      [212.03,316.06,43.61,245.26],
      [217.21,305.06,74.26,230.33],
      [223.29,294.53,135.16,238.6],
      [230.23,284.54,159.15,230.58],
      [237.99,275.17,189.98,231.95],
      [246.5,266.48,215.5,233.47],
      [255.7,258.53,233.2,230.15],
      [265.54,251.38,240.04,212.99],
      [275.95,245.08,263.09,221.71],
      [286.84,239.68,273.98,210.8],
      [298.15,235.2,286.71,202.37],
      [309.79,231.68,301.76,200.41],
      [321.69,229.16,318.23,208.7],
      [333.75,227.63,332.61,214.05],
    ],
  };

  // ── Precompute: decompose each line into start point + vector ──
  // For each line: start = (x1,y1), vector = (x2-x1, y2-y1)
  // When scaling, the end point = start + vector * sliderValue

  const DIMENSIONS = [
    { name: 'Obsession',      key: 'obsession' },
    { name: 'Presence',       key: 'presence' },
    { name: 'Vision',         key: 'vision' },
    { name: 'Founder Fit',    key: 'founderFit' },
    { name: 'Scalable Logic', key: 'scalableLogic' },
  ];

  // Build processed line data: for each domain, store [{sx, sy, vx, vy}, ...]
  const LINES = {};
  for (const dim of DIMENSIONS) {
    LINES[dim.key] = RAW[dim.key].map(([x1, y1, x2, y2]) => ({
      sx: x1, sy: y1,
      vx: x2 - x1, vy: y2 - y1,
    }));
  }

  // ── Now do vector addition for shared start points ──
  // Group all lines across all domains by start point (with tolerance)
  // Then sum vectors per group, tracking which domains contribute

  const TOL = 0.5;

  function ptKey(x, y) {
    // Round to tolerance grid for grouping
    return `${Math.round(x * 2) / 2},${Math.round(y * 2) / 2}`;
  }

  // Build a merged structure: for each unique start point,
  // collect all (domain, vector) pairs
  function buildMergedLines(values) {
    const groups = {};

    for (const dim of DIMENSIONS) {
      const scale = values[dim.key];
      for (const line of LINES[dim.key]) {
        const key = ptKey(line.sx, line.sy);
        if (!groups[key]) {
          groups[key] = { sx: line.sx, sy: line.sy, vx: 0, vy: 0 };
        }
        groups[key].vx += line.vx * scale;
        groups[key].vy += line.vy * scale;
      }
    }

    return Object.values(groups);
  }

  // ── Slider state ──
  const values = {};
  DIMENSIONS.forEach(d => values[d.key] = 1.0);

  // ── Animation state ──
  let animProgress = 0;       // 0 → 1 over the intro
  let animStartTime = null;
  const ANIM_DURATION = 1400; // ms
  let animating = true;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function animationLoop(timestamp) {
    if (!animStartTime) animStartTime = timestamp;
    const elapsed = timestamp - animStartTime;
    animProgress = Math.min(elapsed / ANIM_DURATION, 1);
    draw();
    if (animProgress < 1) {
      requestAnimationFrame(animationLoop);
    } else {
      animating = false;
    }
  }

  // ── Canvas ──
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  let canvasSize, dpr, drawScale, offsetX, offsetY;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    canvasSize = Math.min(rect.width, rect.height);
    canvas.width = canvasSize * dpr;
    canvas.height = canvasSize * dpr;
    canvas.style.width = canvasSize + 'px';
    canvas.style.height = canvasSize + 'px';

    // Map SVG coordinates to canvas
    // Add padding so the full burst fits
    const padding = 0.05;
    drawScale = (canvasSize * dpr * (1 - padding * 2)) / Math.max(SVG_W, SVG_H);
    offsetX = (canvasSize * dpr - SVG_W * drawScale) / 2;
    offsetY = (canvasSize * dpr - SVG_H * drawScale) / 2;

    draw();
  }

  function tx(x) { return x * drawScale + offsetX; }
  function ty(y) { return y * drawScale + offsetY; }

  // ── Label positions (placed outside the burst, along pentagon vertex directions) ──
  function getLabelPos(vertexIdx) {
    const vx = PENTAGON[vertexIdx][0];
    const vy = PENTAGON[vertexIdx][1];
    const dx = vx - SVG_CX;
    const dy = vy - SVG_CY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const labelDist = dist + 125; // push labels well outside
    return {
      x: SVG_CX + (dx / dist) * labelDist,
      y: SVG_CY + (dy / dist) * labelDist,
    };
  }

  // ── Draw ──
  function draw() {
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    const bgGrad = ctx.createRadialGradient(
      tx(SVG_CX), ty(SVG_CY), 0,
      tx(SVG_CX), ty(SVG_CY), W * 0.6
    );
    bgGrad.addColorStop(0, '#102a30');
    bgGrad.addColorStop(0.6, '#0d2228');
    bgGrad.addColorStop(1, '#0a1a1f');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    const lw = Math.max(1, 1.8 * drawScale);

    // ── Merged radiating lines ──
    const merged = buildMergedLines(values);
    const ease = easeOutCubic(animProgress);

    for (const line of merged) {
      const len = Math.sqrt(line.vx * line.vx + line.vy * line.vy);
      if (len < 0.5) continue;

      const ex = line.sx + line.vx * ease;
      const ey = line.sy + line.vy * ease;

      // Opacity scales with line length relative to max possible
      const maxLen = 400; // approximate max line length in SVG units
      const alpha = 0.25 + 0.6 * Math.min(len / maxLen, 1);

      ctx.beginPath();
      ctx.moveTo(tx(line.sx), ty(line.sy));
      ctx.lineTo(tx(ex), ty(ey));
      ctx.strokeStyle = `rgba(201, 169, 110, ${alpha})`;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // ── Circle ──
    ctx.beginPath();
    ctx.arc(tx(SVG_CX), ty(SVG_CY), CIRCLE_R_SVG * drawScale, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180, 200, 210, 0.12)';
    ctx.lineWidth = Math.max(0.5, 1 * drawScale);
    ctx.stroke();

    // ── Outer Pentagon ──
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const px = tx(PENTAGON[i][0]);
      const py = ty(PENTAGON[i][1]);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(180, 200, 210, 0.18)';
    ctx.lineWidth = Math.max(1, 1.2 * drawScale);
    ctx.stroke();

    // ── Inner spider rings ──
    const rings = [0.33, 0.66];
    for (const frac of rings) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const px = SVG_CX + (PENTAGON[i][0] - SVG_CX) * frac;
        const py = SVG_CY + (PENTAGON[i][1] - SVG_CY) * frac;
        if (i === 0) ctx.moveTo(tx(px), ty(py));
        else ctx.lineTo(tx(px), ty(py));
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(180, 200, 210, 0.08)';
      ctx.lineWidth = Math.max(0.5, 0.8 * drawScale);
      ctx.stroke();
    }

    // ── Spokes ──
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(tx(SVG_CX), ty(SVG_CY));
      ctx.lineTo(tx(PENTAGON[i][0]), ty(PENTAGON[i][1]));
      ctx.strokeStyle = 'rgba(180, 200, 210, 0.08)';
      ctx.lineWidth = Math.max(0.5, 0.8 * drawScale);
      ctx.stroke();
    }

    // ── Spider chart score shape ──
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const val = values[DIMENSIONS[i].key];
      const px = SVG_CX + (PENTAGON[i][0] - SVG_CX) * val;
      const py = SVG_CY + (PENTAGON[i][1] - SVG_CY) * val;
      if (i === 0) ctx.moveTo(tx(px), ty(py));
      else ctx.lineTo(tx(px), ty(py));
    }
    ctx.closePath();

    const spiderGrad = ctx.createRadialGradient(
      tx(SVG_CX), ty(SVG_CY), 0,
      tx(SVG_CX), ty(SVG_CY), CIRCLE_R_SVG * drawScale
    );
    spiderGrad.addColorStop(0, 'rgba(30, 140, 120, 0.06)');
    spiderGrad.addColorStop(1, 'rgba(30, 140, 120, 0.2)');
    ctx.fillStyle = spiderGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(100, 210, 180, 0.55)';
    ctx.lineWidth = Math.max(1, 1.6 * drawScale);
    ctx.stroke();

    // ── Score dots on pentagon vertices ──
    for (let i = 0; i < 5; i++) {
      const val = values[DIMENSIONS[i].key];
      const px = SVG_CX + (PENTAGON[i][0] - SVG_CX) * val;
      const py = SVG_CY + (PENTAGON[i][1] - SVG_CY) * val;
      const dotR = Math.max(3, 4.5 * drawScale);

      ctx.beginPath();
      ctx.arc(tx(px), ty(py), dotR, 0, Math.PI * 2);
      ctx.fillStyle = '#d4b070';
      ctx.fill();
      ctx.strokeStyle = 'rgba(10, 26, 31, 0.6)';
      ctx.lineWidth = Math.max(1, 1.5 * drawScale);
      ctx.stroke();
    }

    // ── Labels ──
    const baseFontSize = 13 * drawScale;
    const fontSize = Math.max(10, baseFontSize);
    const scoreFontSize = Math.max(9, 11 * drawScale);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let i = 0; i < 5; i++) {
      const val = values[DIMENSIONS[i].key];
      const lp = getLabelPos(i);

      ctx.font = `400 ${fontSize}px 'Cormorant Garamond', serif`;
      ctx.fillStyle = 'rgba(200, 210, 215, 0.75)';
      ctx.fillText(DIMENSIONS[i].name.toUpperCase(), tx(lp.x), ty(lp.y) - scoreFontSize * 0.8);

      ctx.font = `300 ${scoreFontSize}px 'DM Sans', sans-serif`;
      ctx.fillStyle = 'rgba(201, 169, 110, 0.8)';
      ctx.fillText((val * 10).toFixed(1), tx(lp.x), ty(lp.y) + fontSize * 0.7);
    }
  }

  // ── Build Controls ──
  const controlsEl = document.getElementById('controls');

  DIMENSIONS.forEach(dim => {
    const row = document.createElement('div');
    row.className = 'slider-row';

    const label = document.createElement('div');
    label.className = 'slider-label';
    label.textContent = dim.name;

    const track = document.createElement('div');
    track.className = 'slider-track';

    const input = document.createElement('input');
    input.type = 'range';
    input.min = '0.01';
    input.max = '1';
    input.step = '0.01';
    input.value = values[dim.key];

    const valDisplay = document.createElement('div');
    valDisplay.className = 'slider-value';
    valDisplay.textContent = (values[dim.key] * 10).toFixed(1);

    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      values[dim.key] = v;
      valDisplay.textContent = (v * 10).toFixed(1);
      draw();
    });

    track.appendChild(input);
    row.appendChild(label);
    row.appendChild(track);
    row.appendChild(valDisplay);
    controlsEl.appendChild(row);
  });

  // ── Init ──
  window.addEventListener('resize', () => {
    resize();
    if (!animating) draw();
  });
  resize();                          // sets up canvas dimensions
  requestAnimationFrame(animationLoop); // kick off intro animation
})();
</script>
</body>
</html>
